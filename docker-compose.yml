# PaperTrail supporting services for local development.
# The app itself is NOT containerized yet — that lands when there is an app to run.
# For now this is just Qdrant, mounting the pre-existing ./qdrant_storage so historical
# data is preserved.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: papertrail-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
